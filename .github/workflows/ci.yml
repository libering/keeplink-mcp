name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install --upgrade "setuptools>=83.0.0"
          pip install -e ".[dev]" pip-audit
      - name: Version consistency check
        run: python scripts/check_version.py
      - name: Lint
        run: ruff check src/ test/
      - name: Test
        run: pytest test/ -v
      - name: Security audit
        # pip-audit's own dependency filelock has CVEs that are fixed only in
        # 4.2.1, which requires Python >=3.11, so the audit cannot pass on 3.10.
        # Audit once, on 3.13.
        if: matrix.python-version == '3.13'
        run: pip-audit --skip-editable
