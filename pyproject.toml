[project]
name = "keeplink-mcp"
dynamic = ["version"]
description = "Async MCP middleware for archiving web pages to the Internet Archive without blocking AI reasoning loops."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "KeepLink Contributors" }]
keywords = ["mcp", "internet-archive", "wayback-machine", "ai-agent", "async"]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
    "Framework :: FastAPI",
]

dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "waybackpy>=3.0.6",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "hypothesis>=6.100.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/keeplink/keeplink-mcp"
Repository = "https://github.com/keeplink/keeplink-mcp"
Issues = "https://github.com/keeplink/keeplink-mcp/issues"
Documentation = "https://github.com/keeplink/keeplink-mcp#readme"

[project.scripts]
keeplink = "keeplink_mcp.main:main"
keeplink-mcp-server = "keeplink_mcp.mcp_server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.hatch.version]
path = "src/keeplink_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/keeplink_mcp"]
